name: CI (macOS)
on:
  push: { branches: [ main, master ] }
  pull_request: { branches: [ main, master ] }
permissions: { contents: read }
concurrency: { group: macos-${{ github.ref }}, cancel-in-progress: true }
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Raku/setup-raku@v1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.zef
            ~/.raku
          key: ${{ runner.os }}-zef-${{ hashFiles('META6.json') }}
          restore-keys: ${{ runner.os }}-zef-
      - run: raku -v
      - run: zef --version
      - run: zef install --/test --deps-only .
      - run: raku -e 'use lib "lib"; use Check::Print; say "Loaded: " ~ Check::Print.^name'
      - env: { CHECKPRINT_PRIV: ${{ runner.temp }}/checkpriv }
        run: |
          mkdir -p "$CHECKPRINT_PRIV/fonts" "$CHECKPRINT_PRIV/images" "$CHECKPRINT_PRIV/registers"
          raku -Ilib -e '
            use Check::Print :ALL;
            print-check-pdf(:path("sample-macos.pdf"),
              :payer-name("John G. and Sally D. Johnson"),
              :payer-address("1234 Oak Crest Drive · Fairview, NY 12345"),
              :bank-name("Local Bank"), :bank-address("Fairview, NY"),
              :payee("City Utilities"), :amount(1.23e0), :date("2025-08-20"),
              :memo("CI smoke"), :check-number(1002),
              :routing-number("123456789"), :account-number("000123456789"),
              :draft
            );
          '
          ls -l sample-macos.pdf
      - uses: actions/upload-artifact@v4
        with: { name: sample-check-macos, path: sample-macos.pdf }
